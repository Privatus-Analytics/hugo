baseURL = "https://example.org/"
title = "Privatus Analytics Hugo example"
languageCode = "en"
disableKinds = ["taxonomy", "term", "RSS", "sitemap"]

[module]
  replacements = "github.com/Privatus-Analytics/hugo -> ../.."
  [[module.imports]]
    path = "github.com/Privatus-Analytics/hugo"

[params.privatusAnalytics]
  siteId = "pa_EXAMPLE123"
  modules = ["engage", "auto"]
  exclude = ["/drafts/*"]
