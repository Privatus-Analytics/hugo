name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        hugo: ["v0.136.0", "v0.167.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the example site and check the output
        run: |
          docker run --rm -e HUGO_CACHEDIR=/tmp/hugo_cache \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/project" --entrypoint sh \
            ghcr.io/gohugoio/hugo:${{ matrix.hugo }} /project/tests/run.sh
